plugins { id 'com.android.application' }

android {
    namespace 'com.bonsai.llm'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bonsai.llm'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '3.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            // Preserve the existing sideload signing key for in-place upgrades.
            storeFile file(System.getenv('BONSAI_KEYSTORE') ?: System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword System.getenv('BONSAI_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('BONSAI_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('BONSAI_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // One UI source for Android and Windows; models/catalog are generated by prepare.py.
    sourceSets { main { assets.srcDirs = ['src/main/assets', '../../static'] } }
    androidResources { noCompress 'gguf' }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22')
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22')
    }
}
