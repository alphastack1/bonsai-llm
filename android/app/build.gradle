plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bonsai.llm'
    compileSdk 36

    defaultConfig {
        applicationId "com.bonsai.llm"
        minSdk 28          // Android 9+ (arm64-v8a baseline)
        targetSdk 36
        versionCode 2
        versionName "2.0.0"

        ndk {
            abiFilters 'arm64-v8a'  // 64-bit ARM only (all modern phones)
        }

        externalNativeBuild {
            cmake {
                targets 'llama-server'
                arguments '-DGGML_OPENMP=OFF',         // No OpenMP on Android
                          '-DGGML_LLAMAFILE=OFF',       // Not needed
                          '-DBUILD_SHARED_LIBS=ON',
                          '-DLLAMA_BUILD_COMMON=ON',    // Required for server
                          '-DLLAMA_BUILD_TOOLS=ON',     // Required for server
                          '-DLLAMA_BUILD_SERVER=ON',    // Build llama-server
                          '-DLLAMA_BUILD_UI=OFF',       // App supplies its own WebView UI
                          '-DLLAMA_USE_PREBUILT_UI=OFF',
                          '-DLLAMA_BUILD_EXAMPLES=OFF',
                          '-DLLAMA_BUILD_TESTS=OFF',
                          '-DLLAMA_CURL=OFF'            // No libcurl on Android
                cppFlags '-march=armv8.2a+dotprod'     // ARMv8.2 with dot product
            }
        }
    }

    signingConfigs {
        release {
            // Use debug keystore for sideloading (no Play Store)
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "4.1.2"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Don't compress GGUF model files in assets
    aaptOptions {
        noCompress 'gguf'
    }

    // Match extractNativeLibs=true in manifest (llama-server must be extracted to run)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'

    // Fix kotlin-stdlib version conflicts
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib-jdk7 is now part of kotlin-stdlib'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib-jdk8 is now part of kotlin-stdlib'
        }
    }
}
